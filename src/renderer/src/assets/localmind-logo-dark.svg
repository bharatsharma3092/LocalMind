<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 150" role="img" aria-labelledby="title desc">
  <title id="title">LocalMind</title>
  <desc id="desc">LocalMind privacy first AI logo for dark mode.</desc>
